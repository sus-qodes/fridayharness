# Friday's model catalog (ADR-0031's 2026-10-21 amendment). Human-maintained and versioned.
#
# The catalog records what Friday knows about a model: who provides it, which harnesses run it,
# whether it is local, its price and provenance. It is not a routing guide: the static role registry
# in src/role-registry.ts chooses the dispatch order. Prices are USD per million tokens.
