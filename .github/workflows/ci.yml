name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  NO_COLOR: "1"

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
        experimental: [false]
        include:
          # Node 26 becomes LTS on 2026-10-28; non-blocking until green for two milestones (plan F.5).
          - os: ubuntu-latest
            node: 26
            experimental: true
          - os: windows-latest
            node: 26
            experimental: true
    steps:
      - name: Keep LF on checkout (.gitattributes is the real guard)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build and typecheck
        run: pnpm turbo run build typecheck --continue

      - name: Test
        run: pnpm turbo run test --continue
        env:
          FRIDAY_TEST_TMP: ${{ runner.temp }}

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            tests/.artifacts/**
            tests/.reports/**
          retention-days: 7
          if-no-files-found: ignore

  clean-install:
    # Proves the lockfile and the allowBuilds review are reproducible without any cache (plan E.2).
    name: clean install (windows, node 24)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --force
